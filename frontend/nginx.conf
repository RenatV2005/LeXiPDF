server {
    listen 80;
    server_name _;
    include /etc/nginx/mime.types;
    
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
