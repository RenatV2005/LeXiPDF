
name: LEXiPDF CD

on:
  workflow_run:
    workflows: ["LEXiPDF CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy LEXiPDF
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      - name: Install Ansible Docker collection
        run: ansible-galaxy collection install community.docker

      - name: Validate required files
        run: |
          test -f deploy/application/compose.yml
          test -f deploy/database/compose.yml
          test -f ansible/templates/.application-env.example.j2
          test -f ansible/templates/.database-env.example.j2

      - name: Check Ansible syntax
        run: |
          ansible-playbook \
            -i ansible/inventory/lexipdf.ini \
            ansible/playbooks/cd-deployment.yml \
            --syntax-check

      - name: Deploy LEXiPDF
        run: |
          ansible-playbook \
            -i ansible/inventory/lexipdf.ini \
            ansible/playbooks/cd-deployment.yml
